<section class="bg-surface-0 rounded-md shadow-card p-5">
  <header class="flex flex-wrap items-start justify-between gap-3 mb-4">
    <div>
      <h2 class="text-sm font-semibold text-surface-900 m-0">{{ title() }}</h2>
      @if (subtitle()) {
        <p class="text-xs text-text-muted mt-1 mb-0">{{ subtitle() }}</p>
      }
    </div>
    <ng-content select="[chartActions]" />
  </header>

  <!-- Alto fijo: chart.js necesita un contenedor dimensionado (maintainAspectRatio: false). -->
  <div class="h-72">
    @if (loading()) {
      <app-loading-spinner [label]="loadingLabel()" />
    } @else if (empty()) {
      <div class="flex items-center justify-center h-full text-sm text-text-muted">
        {{ emptyMessage() }}
      </div>
    } @else {
      <ng-content />
    }
  </div>
</section>
