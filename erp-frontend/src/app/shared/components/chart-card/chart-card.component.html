<section class="bg-surface-0 rounded-md shadow-card p-5">
  <header class="flex flex-wrap items-start justify-between gap-3 mb-4">
    <div>
      <h2 class="text-sm font-semibold text-surface-900 m-0">{{ title() }}</h2>
      @if (subtitle()) {
        <p class="text-xs text-text-muted mt-1 mb-0">{{ subtitle() }}</p>
      }
    </div>
    <ng-content select="[chartActions]" />
  </header>

  <!--
    El contenido se renderiza SIEMPRE dentro de su contenedor con alto fijo: chart.js
    necesita un contenedor dimensionado, y esconderlo detrás de un @if lo dejaría
    inicializando sobre un canvas de 0×0. Los estados se superponen encima.
  -->
  <div class="h-72 relative">
    <div class="h-full">
      <ng-content />
    </div>

    @if (loading()) {
      <div class="absolute inset-0 flex items-center justify-center bg-surface-0">
        <app-loading-spinner [label]="loadingLabel()" />
      </div>
    } @else if (empty()) {
      <div
        class="absolute inset-0 flex items-center justify-center bg-surface-0 text-sm text-text-muted"
      >
        {{ emptyMessage() }}
      </div>
    }
  </div>
</section>
