<app-page-header
  title="Ventas"
  subtitle="Registro y consulta de ventas"
  actionLabel="Nueva venta"
  (action)="onNew()"
/>

<div class="bg-surface-0 rounded-md shadow-card p-4 mb-4 flex flex-wrap gap-3 items-end">
  <div class="flex flex-col gap-1">
    <label for="statusFilter" class="text-xs font-medium text-surface-700">Estado</label>
    <p-dropdown
      inputId="statusFilter"
      [options]="statusOptions"
      optionLabel="label"
      optionValue="value"
      [ngModel]="statusFilter"
      (ngModelChange)="statusFilter = $event; onFilterChange()"
      styleClass="w-56"
    />
  </div>

  <div class="flex flex-col gap-1">
    <label for="fromDate" class="text-xs font-medium text-surface-700">Desde</label>
    <input
      pInputText
      id="fromDate"
      type="date"
      [ngModel]="fromDate"
      (ngModelChange)="fromDate = $event; onFilterChange()"
    />
  </div>

  <div class="flex flex-col gap-1">
    <label for="toDate" class="text-xs font-medium text-surface-700">Hasta</label>
    <input
      pInputText
      id="toDate"
      type="date"
      [ngModel]="toDate"
      (ngModelChange)="toDate = $event; onFilterChange()"
    />
  </div>

  @if (statusFilter || fromDate || toDate) {
    <p-button
      label="Limpiar"
      icon="pi pi-filter-slash"
      severity="secondary"
      [text]="true"
      (onClick)="clearFilters()"
    />
  }
</div>

<app-data-table
  [columns]="columns"
  [rows]="rows()"
  [total]="total()"
  [loading]="loading()"
  [searchRequired]="true"
  searchPlaceholder="Buscar por cliente..."
  emptyMessage="No se encontraron ventas para esa búsqueda y los filtros aplicados."
  (lazyLoad)="onLazyLoad($event)"
>
  <ng-template #rowActions let-row>
    <p-button
      icon="pi pi-eye"
      [text]="true"
      [rounded]="true"
      severity="secondary"
      pTooltip="Ver detalle"
      tooltipPosition="top"
      ariaLabel="Ver detalle de venta"
      (onClick)="onView(row)"
    />
  </ng-template>
</app-data-table>
