<form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4 pt-2">
  <div class="flex flex-col gap-1">
    <label for="categoryName" class="text-sm font-medium text-surface-700">Nombre *</label>
    <input
      pInputText
      id="categoryName"
      type="text"
      formControlName="name"
      class="w-full"
      [class.ng-invalid]="isInvalid()"
    />
    @if (isInvalid()) {
      <small class="text-danger">El nombre es obligatorio (mínimo 2 caracteres).</small>
    }
  </div>

  <div class="flex justify-end gap-2">
    <p-button
      type="button"
      label="Cancelar"
      severity="secondary"
      [text]="true"
      [disabled]="saving()"
      (onClick)="cancel()"
    />
    <p-button
      type="submit"
      label="Crear categoría"
      icon="pi pi-check"
      [loading]="saving()"
      [disabled]="saving()"
    />
  </div>
</form>
