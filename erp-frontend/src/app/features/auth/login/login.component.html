<div class="min-h-screen flex items-center justify-center bg-surface-100 p-4">
  <form
    [formGroup]="form"
    (ngSubmit)="submit()"
    class="w-full max-w-sm bg-surface-0 rounded-md shadow-card p-8"
  >
    <div class="flex items-center gap-2 mb-6">
      <i class="pi pi-box text-accent text-2xl"></i>
      <span class="text-lg font-semibold text-surface-900">PerliNor ERP</span>
    </div>

    <h1 class="text-base font-semibold text-surface-900 m-0">Iniciar sesión</h1>
    <p class="text-sm text-text-muted mt-1 mb-5">Ingresá tus credenciales para continuar.</p>

    @if (errorMessage()) {
      <p-message severity="error" [text]="errorMessage()" styleClass="w-full mb-4" />
    }

    <div class="flex flex-col gap-1 mb-4">
      <label for="email" class="text-sm font-medium text-surface-700">Email</label>
      <input
        pInputText
        id="email"
        type="email"
        formControlName="email"
        autocomplete="username"
        placeholder="admin@perlinor.local"
        class="w-full"
        [class.ng-invalid]="isInvalid('email')"
      />
      @if (isInvalid('email')) {
        <small class="text-danger">Ingresá un email válido.</small>
      }
    </div>

    <div class="flex flex-col gap-1 mb-6">
      <label for="password" class="text-sm font-medium text-surface-700">Contraseña</label>
      <p-password
        inputId="password"
        formControlName="password"
        [feedback]="false"
        [toggleMask]="true"
        autocomplete="current-password"
        styleClass="w-full"
        [inputStyleClass]="'w-full'"
      />
      @if (isInvalid('password')) {
        <small class="text-danger">La contraseña es obligatoria.</small>
      }
    </div>

    <p-button
      type="submit"
      label="Ingresar"
      icon="pi pi-sign-in"
      styleClass="w-full"
      [loading]="loading()"
      [disabled]="loading()"
    />

    <a
      routerLink="/forgot-password"
      class="block text-center text-sm text-accent hover:underline mt-5"
    >
      ¿Olvidaste tu contraseña?
    </a>
  </form>
</div>
