# Entorno de desarrollo local: PostgreSQL 16 + Adminer + Mailpit
# Levantar:  docker compose up -d
# Detener:   docker compose down
services:
  postgres:
    image: postgres:16
    container_name: erp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_dev_password
      POSTGRES_DB: erp_db
    ports:
      - "5432:5432"
    volumes:
      - erp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_user -d erp_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: erp_adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  # SMTP de prueba: recibe los mails de la app y los muestra en http://localhost:8025
  # en vez de entregarlos. Nada sale a internet, así que el link de recuperación de
  # contraseña se clickea desde la bandeja sin tocar una casilla real.
  # Acepta conexiones sin autenticación: SMTP_USER y SMTP_PASS van vacíos en el .env.
  mailpit:
    image: axllent/mailpit:latest
    container_name: erp_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP — es el puerto al que apunta SMTP_PORT
      - "8025:8025"   # Bandeja web

volumes:
  erp_pgdata:
