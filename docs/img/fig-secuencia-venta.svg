<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 790" width="900" height="790"
     font-family="Segoe UI, Helvetica, Arial, sans-serif">

  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/>
    </marker>
    <marker id="fr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666"/>
    </marker>
    <marker id="fe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- ═══════════ Participantes ═══════════ -->
  <g font-size="11.5" font-weight="600" text-anchor="middle">
    <rect x="25" y="20" width="130" height="38" rx="4" fill="#f7f9fc" stroke="#111" stroke-width="1.4"/>
    <text x="90" y="44">Usuario</text>

    <rect x="215" y="20" width="150" height="38" rx="4" fill="#f7f9fc" stroke="#111" stroke-width="1.4"/>
    <text x="290" y="38">Aplicación cliente</text>
    <text x="290" y="52" font-size="9.5" font-weight="400" fill="#666">formulario de venta</text>

    <rect x="455" y="20" width="150" height="38" rx="4" fill="#f7f9fc" stroke="#111" stroke-width="1.4"/>
    <text x="530" y="38">Servidor</text>
    <text x="530" y="52" font-size="9.5" font-weight="400" fill="#666">módulo de ventas</text>

    <rect x="700" y="20" width="150" height="38" rx="4" fill="#f7f9fc" stroke="#111" stroke-width="1.4"/>
    <text x="775" y="38">Base de datos</text>
    <text x="775" y="52" font-size="9.5" font-weight="400" fill="#666">PostgreSQL</text>
  </g>

  <!-- ═══════════ Líneas de vida ═══════════ -->
  <g stroke="#999" stroke-width="1" stroke-dasharray="4 4">
    <line x1="90"  y1="58" x2="90"  y2="745"/>
    <line x1="290" y1="58" x2="290" y2="745"/>
    <line x1="530" y1="58" x2="530" y2="745"/>
    <line x1="775" y1="58" x2="775" y2="745"/>
  </g>

  <!-- ═══════════ Mensajes previos ═══════════ -->
  <g font-size="10.5">
    <line x1="90" y1="90" x2="286" y2="90" stroke="#111" stroke-width="1.3" marker-end="url(#f)"/>
    <text x="188" y="84" text-anchor="middle">carga cliente, medio de pago y líneas</text>

    <!-- autollamada del cliente -->
    <path d="M 290 110 L 340 110 L 340 132 L 294 132" fill="none" stroke="#111" stroke-width="1.3" marker-end="url(#f)"/>
    <text x="348" y="118" font-size="10">previsualiza subtotal y total</text>
    <text x="348" y="131" font-size="9.5" fill="#666">aritmética decimal · solo vista previa</text>

    <line x1="90" y1="156" x2="286" y2="156" stroke="#111" stroke-width="1.3" marker-end="url(#f)"/>
    <text x="188" y="150" text-anchor="middle" font-weight="600">Registrar</text>

    <line x1="290" y1="186" x2="526" y2="186" stroke="#111" stroke-width="1.3" marker-end="url(#f)"/>
    <text x="408" y="180" text-anchor="middle">POST /api/commercial/sales</text>
    <text x="408" y="199" text-anchor="middle" font-size="9.5" fill="#666">sin precios: los define el servidor</text>

    <path d="M 530 216 L 580 216 L 580 238 L 534 238" fill="none" stroke="#111" stroke-width="1.3" marker-end="url(#f)"/>
    <text x="588" y="224" font-size="10">autenticación · permiso · validación</text>
    <text x="588" y="237" font-size="9.5" fill="#666">commercial.create</text>
  </g>

  <!-- ═══════════ Marco de la transacción ═══════════ -->
  <rect x="500" y="258" width="360" height="300" rx="3" fill="none" stroke="#2563eb" stroke-width="1.4"/>
  <path d="M 500 258 L 594 258 L 594 276 L 584 286 L 500 286 Z" fill="#2563eb"/>
  <text x="508" y="272" font-size="10" font-weight="700" fill="#fff">TRANSACCIÓN</text>
  <text x="604" y="272" font-size="9.5" fill="#2563eb" font-style="italic">todo o nada</text>

  <!-- ═══════════ Pasos dentro de la transacción ═══════════ -->
  <g font-size="10.5">
    <line x1="530" y1="306" x2="771" y2="306" stroke="#111" stroke-width="1.2" marker-end="url(#f)"/>
    <text x="650" y="300" text-anchor="middle">1 · verifica cliente vigente</text>

    <line x1="530" y1="334" x2="771" y2="334" stroke="#111" stroke-width="1.2" marker-end="url(#f)"/>
    <text x="650" y="328" text-anchor="middle">2 · verifica caja de ventas</text>

    <line x1="530" y1="362" x2="771" y2="362" stroke="#111" stroke-width="1.2" marker-end="url(#f)"/>
    <text x="650" y="356" text-anchor="middle">3 · lee materiales y agrega cantidades</text>

    <!-- Paso clave -->
    <line x1="530" y1="400" x2="771" y2="400" stroke="#b91c1c" stroke-width="2" marker-end="url(#fe)"/>
    <text x="650" y="386" text-anchor="middle" font-size="10.5" font-weight="700" fill="#b91c1c">
      4 · UPDATE stock WHERE stock &#8805; requerido
    </text>
    <text x="650" y="416" text-anchor="middle" font-size="9.5" fill="#b91c1c">
      condición y descuento en una sola sentencia
    </text>

    <line x1="771" y1="438" x2="534" y2="438" stroke="#666" stroke-width="1.2"
          stroke-dasharray="5 3" marker-end="url(#fr)"/>
    <text x="650" y="432" text-anchor="middle" fill="#666">filas afectadas</text>

    <line x1="530" y1="478" x2="771" y2="478" stroke="#111" stroke-width="1.2" marker-end="url(#f)"/>
    <text x="650" y="472" text-anchor="middle">5 · crea venta y líneas · precio congelado</text>

    <line x1="530" y1="506" x2="771" y2="506" stroke="#111" stroke-width="1.2" marker-end="url(#f)"/>
    <text x="650" y="500" text-anchor="middle">6 · movimiento de egreso por línea</text>

    <line x1="530" y1="534" x2="771" y2="534" stroke="#111" stroke-width="1.2" marker-end="url(#f)"/>
    <text x="650" y="528" text-anchor="middle">7 · ingreso en caja y saldo</text>
  </g>

  <!-- ═══════════ Camino de error ═══════════ -->
  <rect x="25" y="380" width="440" height="76" rx="4" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.2"/>
  <text x="40" y="400" font-size="10.5" font-weight="700" fill="#b91c1c">Si ninguna fila resulta afectada</text>
  <text x="40" y="417" font-size="10" fill="#7f1d1d">El stock ya fue consumido por otra operación simultánea.</text>
  <text x="40" y="432" font-size="10" fill="#7f1d1d">La transacción revierte por completo y responde <tspan font-weight="700">422</tspan>:</text>
  <text x="40" y="448" font-size="10" fill="#7f1d1d" font-style="italic">no hay venta, ni movimientos, ni descuento de stock.</text>
  <line x1="465" y1="410" x2="496" y2="400" stroke="#b91c1c" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- ═══════════ Después de confirmar ═══════════ -->
  <g font-size="10.5">
    <line x1="530" y1="590" x2="771" y2="590" stroke="#111" stroke-width="1.2" marker-end="url(#f)"/>
    <text x="650" y="584" text-anchor="middle">registra la auditoría</text>
    <text x="650" y="604" text-anchor="middle" font-size="9.5" fill="#666">fuera de la transacción, ya confirmada</text>

    <line x1="526" y1="646" x2="294" y2="646" stroke="#666" stroke-width="1.3"
          stroke-dasharray="5 3" marker-end="url(#fr)"/>
    <text x="410" y="640" text-anchor="middle" fill="#666">201 · venta confirmada</text>

    <line x1="286" y1="686" x2="94" y2="686" stroke="#111" stroke-width="1.3" marker-end="url(#f)"/>
    <text x="190" y="680" text-anchor="middle">muestra el detalle de la venta</text>
  </g>

  <!-- ═══════════ Nota al pie ═══════════ -->
  <line x1="25" y1="726" x2="875" y2="726" stroke="#ccc" stroke-width="1"/>
  <text x="25" y="746" font-size="10" fill="#555">
    El paso 4 es el que garantiza que dos ventas simultáneas no consuman la misma existencia: la condición viaja dentro de la sentencia
  </text>
  <text x="25" y="761" font-size="10" fill="#555">
    de actualización, de modo que el motor bloquea la fila y la reevalúa sobre el valor vigente, no sobre uno leído antes.
  </text>
  <text x="25" y="780" font-size="9.5" fill="#888" font-style="italic">
    Verificado por la prueba automatizada de concurrencia (Capítulo XII).
  </text>
</svg>
