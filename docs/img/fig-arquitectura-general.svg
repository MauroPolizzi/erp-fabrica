<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="920" height="430"
     font-family="Segoe UI, Helvetica, Arial, sans-serif">

  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/>
    </marker>
    <marker id="flechaGris" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#777"/>
    </marker>
  </defs>

  <!-- ═══════════ Navegador ═══════════ -->
  <rect x="20" y="70" width="230" height="180" rx="6" fill="#f7f9fc" stroke="#111" stroke-width="1.5"/>
  <text x="135" y="94" text-anchor="middle" font-size="13" font-weight="600">Navegador web</text>
  <line x1="20" y1="104" x2="250" y2="104" stroke="#111" stroke-width="1"/>

  <rect x="40" y="120" width="190" height="110" rx="4" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="135" y="144" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2563eb">Aplicación cliente</text>
  <text x="135" y="164" text-anchor="middle" font-size="11">Angular 19</text>
  <text x="135" y="184" text-anchor="middle" font-size="10.5" fill="#555">Interfaz de usuario</text>
  <text x="135" y="199" text-anchor="middle" font-size="10.5" fill="#555">Validación preventiva</text>
  <text x="135" y="214" text-anchor="middle" font-size="10.5" fill="#555">Presentación de datos</text>

  <!-- ═══════════ Servidor ═══════════ -->
  <rect x="360" y="45" width="230" height="230" rx="6" fill="#f7f9fc" stroke="#111" stroke-width="1.5"/>
  <text x="475" y="69" text-anchor="middle" font-size="13" font-weight="600">Servidor de aplicación</text>
  <line x1="360" y1="79" x2="590" y2="79" stroke="#111" stroke-width="1"/>

  <rect x="380" y="95" width="190" height="160" rx="4" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="475" y="119" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2563eb">API REST</text>
  <text x="475" y="139" text-anchor="middle" font-size="11">Node.js 20 + Express</text>
  <text x="475" y="163" text-anchor="middle" font-size="10.5" fill="#555">Reglas de negocio</text>
  <text x="475" y="178" text-anchor="middle" font-size="10.5" fill="#555">Autenticación y permisos</text>
  <text x="475" y="193" text-anchor="middle" font-size="10.5" fill="#555">Integridad transaccional</text>
  <text x="475" y="208" text-anchor="middle" font-size="10.5" fill="#555">Generación de reportes</text>
  <text x="475" y="223" text-anchor="middle" font-size="10.5" fill="#555">Registro de auditoría</text>
  <text x="475" y="243" text-anchor="middle" font-size="10" fill="#888" font-style="italic">17 módulos</text>

  <!-- ═══════════ Base de datos ═══════════ -->
  <g>
    <ellipse cx="790" cy="115" rx="70" ry="16" fill="#fff" stroke="#111" stroke-width="1.5"/>
    <path d="M 720 115 L 720 195 A 70 16 0 0 0 860 195 L 860 115"
          fill="#fff" stroke="#111" stroke-width="1.5"/>
    <ellipse cx="790" cy="115" rx="70" ry="16" fill="none" stroke="#111" stroke-width="1.5"/>
    <text x="790" y="150" text-anchor="middle" font-size="12.5" font-weight="600">PostgreSQL 16</text>
    <text x="790" y="170" text-anchor="middle" font-size="10.5" fill="#555">22 entidades</text>
    <text x="790" y="185" text-anchor="middle" font-size="10.5" fill="#555">3 migraciones</text>
  </g>

  <!-- ═══════════ SMTP (opcional) ═══════════ -->
  <rect x="700" y="290" width="180" height="70" rx="4"
        fill="#fff" stroke="#777" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="790" y="315" text-anchor="middle" font-size="12" font-weight="600" fill="#555">Servidor de correo</text>
  <text x="790" y="333" text-anchor="middle" font-size="10.5" fill="#777">SMTP · externo</text>
  <text x="790" y="349" text-anchor="middle" font-size="10" fill="#777" font-style="italic">opcional</text>

  <!-- ═══════════ Conexiones ═══════════ -->

  <!-- Cliente ↔ Servidor -->
  <line x1="250" y1="150" x2="358" y2="150" stroke="#111" stroke-width="1.5"
        marker-start="url(#flecha)" marker-end="url(#flecha)"/>
  <text x="304" y="136" text-anchor="middle" font-size="10.5" font-weight="600">HTTP / JSON</text>
  <text x="304" y="169" text-anchor="middle" font-size="9.5" fill="#666">token de acceso</text>

  <!-- Servidor ↔ Base -->
  <line x1="590" y1="155" x2="718" y2="155" stroke="#111" stroke-width="1.5"
        marker-start="url(#flecha)" marker-end="url(#flecha)"/>
  <text x="654" y="141" text-anchor="middle" font-size="10.5" font-weight="600">TCP 5432</text>
  <text x="654" y="174" text-anchor="middle" font-size="9.5" fill="#666">transacciones</text>

  <!-- Servidor → SMTP -->
  <path d="M 540 275 L 540 325 L 698 325" fill="none" stroke="#777" stroke-width="1.3"
        stroke-dasharray="5 3" marker-end="url(#flechaGris)"/>
  <text x="610" y="316" text-anchor="middle" font-size="9.5" fill="#777">recuperación de contraseña</text>

  <!-- ═══════════ Notas al pie ═══════════ -->
  <line x1="20" y1="385" x2="900" y2="385" stroke="#ccc" stroke-width="1"/>
  <text x="20" y="405" font-size="10" fill="#555">
    Dos procesos y una base de datos. El servidor de correo es el único componente externo y su ausencia no impide la operación:
  </text>
  <text x="20" y="420" font-size="10" fill="#555">
    sin él, el sistema funciona y el enlace de recuperación queda registrado en el log en lugar de enviarse.
  </text>
</svg>
